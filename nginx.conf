worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Resolve service names through Docker's embedded DNS at request time. Using a
  # variable in proxy_pass (rather than a static upstream{}) means nginx starts
  # even when a backend is temporarily down, and picks up a container's new IP
  # after it is recreated instead of caching the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $uri $backend {
    default                    "core:8004";
    ~^/v1/auth                 "auth:8001";
    ~^/v1/vault                "vault:8002";
    ~^/v1/jobs                 "job-tracker:8003";
    ~^/v1/companies            "job-tracker:8003";
    ~^/v1/applications         "job-tracker:8003";
    ~^/v1/resumes              "job-tracker:8003";
    ~^/v1/contacts             "job-tracker:8003";
    ~^/v1/skills               "job-tracker:8003";
    ~^/v1/notifications        "job-tracker:8003";
    ~^/v1/follow-ups           "job-tracker:8003";
    ~^/v1/analytics            "job-tracker:8003";
    ~^/v1/search-configs       "job-tracker:8003";
    ~^/v1/notes                "notes:8007";
    ~^/v1/folders              "notes:8007";
    ~^/v1/tags                 "notes:8007";
    ~^/v1/templates            "notes:8007";
    ~^/v1/finance              "finance-tracker:8006";
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /health {
      access_log off;
      return 200 "ok";
    }

    location /v1/ {
      set $target $backend;
      proxy_pass http://$target;
      client_max_body_size 10m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
