worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Resolve service names through Docker's embedded DNS at request time. Using a
  # variable in proxy_pass (rather than a static upstream{}) means nginx starts
  # even when a backend is temporarily down, and picks up a container's new IP
  # after it is recreated instead of caching the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $uri $backend {
    default                    "core:8004";
    ~^/v1/auth                 "auth:8001";
    ~^/v1/vault                "vault:8002";
    ~^/v1/jobs                 "job-tracker:8003";
    ~^/v1/resumes              "job-tracker:8003";
    ~^/v1/skills               "job-tracker:8003";
    ~^/v1/career-profile       "job-tracker:8003";
    ~^/v1/notes                "notes:8007";
    ~^/v1/folders              "notes:8007";
    ~^/v1/tags                 "notes:8007";
    ~^/v1/templates            "notes:8007";
    ~^/v1/finance              "finance-tracker:8006";
    ~^/v1/batches              "batches:8005";
    ~^/v1/habits               "habit-tracker:8008";
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /health {
      access_log off;
      return 200 "ok";
    }

    location /v1/ {
      set $target $backend;
      proxy_pass http://$target;
      client_max_body_size 10m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # from-link does a server-side fetch + a Claude call. tailor-resume is the worst case, and
      # its worst case keeps growing: an Ollama attempt that can hang before falling back, the
      # main tailoring generation, a second full generation if the draft overflows a page or
      # slips in a typographic dash, then a resume-parse of the result for scoring - itself
      # retried on Claude if Ollama silently returns zero skills. That's up to 4 sequential model
      # calls plus 2 LaTeX compiles in one request - measured exceeding 300s in practice, which
      # silently killed the client connection while the backend kept running and saved the result
      # anyway a bit later. 600s covers today's worst case; if it grows again, the real fix is
      # making tailoring async (kick off + poll) rather than raising this indefinitely.
      proxy_connect_timeout 10s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
    }
  }
}
