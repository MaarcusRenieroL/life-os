worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Behind a Cloudflare Tunnel every request arrives from the local tunnel process, so the address
  # that matters is the one Cloudflare forwards. Falls back to the socket address for LAN/local use.
  map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
  }

  # Credential endpoints get a tight per-client budget; nothing else is counted (empty key = not limited).
  # Signup is already closed by the auth service, so this mostly stops password guessing.
  map "$request_method$uri" $credential_key {
    default "";
    ~^POST/v1/auth/(login|register|biometric/login|biometric/challenge|me/verify-password)$ $client_ip;
    ~^DELETE/v1/auth/me$ $client_ip;
    ~^POST/v1/vault/(verify|master-password/change|recovery-codes/(generate|redeem|reset))$ $client_ip;
  }
  limit_req_zone $credential_key zone=credentials:10m rate=10r/m;
  limit_req_status 429;

  # life-os-api.maarcus.dev is the address the native apps use. It sits outside Cloudflare Access (an
  # app cannot do the browser login Access wants), so it serves the API only: every website,
  # asset and download path answers 404 there. The website stays behind Access on life-os.maarcus.dev.
  map $host $api_only {
    default 0;
    life-os-api.maarcus.dev 1;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Resolve service names through Docker's embedded DNS at request time. Using a
  # variable in proxy_pass (rather than a static upstream{}) means nginx starts
  # even when a backend is temporarily down, and picks up a container's new IP
  # after it is recreated instead of caching the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $uri $backend {
    default                    "core:8004";
    ~^/v1/auth                 "auth:8001";
    ~^/v1/vault                "vault:8002";
    ~^/v1/jobs                 "job-tracker:8003";
    ~^/v1/resumes              "job-tracker:8003";
    ~^/v1/skills               "job-tracker:8003";
    ~^/v1/career-profile       "job-tracker:8003";
    ~^/v1/notes                "notes:8007";
    ~^/v1/folders              "notes:8007";
    ~^/v1/tags                 "notes:8007";
    ~^/v1/templates            "notes:8007";
    ~^/v1/finance              "finance-tracker:8006";
    ~^/v1/batches              "batches:8005";
    ~^/v1/habits               "habit-tracker:8008";
    ~^/v1/tasks                "tasks:8009";
    ~^/v1/goals                "tasks:8009";
    ~^/v1/workouts             "workouts:8011";
    ~^/v1/calendar             "calendar:8010";
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Service-to-service endpoints (/v1/<service>/internal/...) are guarded only by a shared key and
    # were never meant to be reachable from outside. Services call each other directly, not through
    # here, so nothing legitimate is lost by refusing them at the door.
    location ~ ^/v1/[^/]+/internal { return 404; }

    # The Gmail connection flow (a consent redirect that returns to /callback) belongs to the website host,
    # which sits behind Cloudflare Access. The API-only address the native apps use never needs it.
    location ~ ^/v1/batches/gmail/(connect|connect-url|callback) {
      if ($api_only) { return 404; }
      set $target "batches:8005";
      proxy_pass http://$target;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never serve dotfiles (.git, .env, ...).
    location ~ /\. { return 404; }

    # Vite fingerprints asset filenames, so they can be cached forever.
    location /assets/ {
      if ($api_only) { return 404; }
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Sideload link for the Android app: life-os.maarcus.dev/files/apk. The file is built locally
    # (see docs/) and dropped into ./files, which is mounted read-only below.
    location = /files/apk {
      if ($api_only) { return 404; }
      alias /usr/share/nginx/files/life-os.apk;
      default_type application/vnd.android.package-archive;
      add_header Content-Disposition 'attachment; filename="life-os.apk"' always;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      if ($api_only) { return 404; }
      try_files $uri $uri/ /index.html;
    }

    location /health {
      access_log off;
      return 200 "ok";
    }

    location /v1/ {
      limit_req zone=credentials burst=5 nodelay;
      set $target $backend;
      proxy_pass http://$target;
      client_max_body_size 10m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
      # from-link does a server-side fetch + a Claude call. tailor-resume is the worst case, and
      # its worst case keeps growing: an Ollama attempt that can hang before falling back, the
      # main tailoring generation, a second full generation if the draft overflows a page or
      # slips in a typographic dash, then a resume-parse of the result for scoring - itself
      # retried on Claude if Ollama silently returns zero skills. That's up to 4 sequential model
      # calls plus 2 LaTeX compiles in one request - measured exceeding 300s in practice, which
      # silently killed the client connection while the backend kept running and saved the result
      # anyway a bit later. 600s covers today's worst case; if it grows again, the real fix is
      # making tailoring async (kick off + poll) rather than raising this indefinitely.
      proxy_connect_timeout 10s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
    }
  }
}
