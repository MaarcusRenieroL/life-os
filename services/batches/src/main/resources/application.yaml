  senders: ${JOB_EMAIL_SENDERS:linkedin.com,indeed.com,indeedemail.com,glassdoor.com,greenhouse.io,lever.co,ashbyhq.com,myworkday.com,smartrecruiters.com}
  poll:
    cron: ${JOB_EMAIL_POLL_CRON:0 30 9,15,21 * * *}
