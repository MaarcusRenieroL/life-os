server:
  port: 8003

spring:
  application:
    name: job-tracker
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: jobs_schema
    default-schema: jobs_schema
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET:TTdGFPf9lbnQ3J3GBU8MnwQfp3oaawcBzf9LlBJpqlE=}

owner:
  user-id: ${OWNER_USER_ID}
  email: ${OWNER_EMAIL:}

internal:
  api-key: ${INTERNAL_API_KEY:H5A1u/lQOivHU+ziG0/oEWUa2oF3uXdZVmuYZH8siFA=}

encryption:
  secret: ${ENCRYPTION_SECRET:wwJvw6iKu4JYUQqc371t2ZDi0ReptRWQ7GDIc2Zs7WM=}

claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

resume:
  storage-path: ${RESUME_STORAGE_PATH:/app/resumes}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

job-scraper:
  base-url: ${JOB_SCRAPER_URL:http://localhost:8007}
