server:
  port: 8006

spring:
  application:
    name: finance-tracker
  datasource:
    hikari:
      maximum-pool-size: 6
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: finance_schema
    default-schema: finance_schema
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: finance_tracker_service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:TTdGFPf9lbnQ3J3GBU8MnwQfp3oaawcBzf9LlBJpqlE=}

# This one is actually used (AccountService encrypts account numbers with it) - unlike the
# other services' inert copy of this property, a real deployment must override this.
encryption:
  secret: ${FINANCE_ENCRYPTION_SECRET:FNhRh4Cv3lxh2B68n9ffJUW+r9R65CpKcZEpjte16UE=}

internal:
  api-key: ${INTERNAL_API_KEY:H5A1u/lQOivHU+ziG0/oEWUa2oF3uXdZVmuYZH8siFA=}

ollama:
  base-url: ${OLLAMA_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:mistral}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

owner:
  user-id: ${OWNER_USER_ID}

finance:
  attention-scan:
    cron: ${FINANCE_ATTENTION_SCAN_CRON:0 0 8 * * *}
