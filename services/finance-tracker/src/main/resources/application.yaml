server:
  port: 8006

spring:
  application:
    name: finance-tracker
  datasource:
    hikari:
      maximum-pool-size: 6
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # A bank-statement import saves a whole statement in one saveAll (see
          # TransactionService#createFromCsvImportBatch) - 100-400 rows, which without batching is
          # one INSERT round-trip per row. Transaction/entity ids use GenerationType.UUID
          # (assigned app-side before insert), not IDENTITY, so Hibernate can actually batch these.
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    schemas: finance_schema
    default-schema: finance_schema
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: finance_tracker_service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}

# This one is actually used (AccountService encrypts account numbers with it) - unlike the
# other services' inert copy of this property, a real deployment must override this.
encryption:
  secret: ${FINANCE_ENCRYPTION_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

ollama:
  base-url: ${OLLAMA_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5:3b}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

owner:
  user-id: ${OWNER_USER_ID}

finance:
  attention-scan:
    cron: ${FINANCE_ATTENTION_SCAN_CRON:0 0 8 * * *}
