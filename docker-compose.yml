services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local model server. Models live in a volume so they're pulled once (see OLLAMA_MODEL).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka:
    restart: unless-stopped
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    restart: unless-stopped
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./files:/usr/share/nginx/files:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app

  # Every module (auth, vault, job-tracker, core, notes, finance, batches, habits, tasks, workouts,
  # calendar) in one JVM. Modules still call each other over HTTP, to this same process.
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      # The owner's timezone: "today", habit reminders and the scheduled jobs all follow it, not UTC.
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, see .env.example}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env, see .env.example}
      OWNER_USER_ID: ${OWNER_USER_ID:?set OWNER_USER_ID in .env to your account id}
      AUTH_OWNER_USER_ID: ${OWNER_USER_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AVATAR_STORAGE_DIR: /data/avatars
      RESUME_STORAGE_DIR: /data/resumes
      # Ollama runs as the "ollama" service below; pull the model once: docker compose exec ollama ollama pull qwen2.5:3b
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      AI_ROUTE_RESUME_PARSE: ${AI_ROUTE_RESUME_PARSE:-ollama}
      AI_ROUTE_JOB_PARSE: ${AI_ROUTE_JOB_PARSE:-ollama}
      AI_ROUTE_EMAIL_CLASSIFY: ${AI_ROUTE_EMAIL_CLASSIFY:-ollama}
      AI_ROUTE_ATS_SUGGESTIONS: ${AI_ROUTE_ATS_SUGGESTIONS:-ollama}
      AI_ROUTE_COVER_LETTER: ${AI_ROUTE_COVER_LETTER:-claude}
      AI_ROUTE_INTERVIEW_PREP: ${AI_ROUTE_INTERVIEW_PREP:-ollama}
      AI_ROUTE_REFERRAL_MESSAGE: ${AI_ROUTE_REFERRAL_MESSAGE:-claude}
      BACKUP_CRON: ${BACKUP_CRON:-0 0 3 * * *}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8005/v1/batches/gmail/callback}
      GMAIL_POST_CONNECT_URL: ${GMAIL_POST_CONNECT_URL:-http://localhost/settings#integrations}
      GMAIL_ENCRYPTION_SECRET: ${GMAIL_ENCRYPTION_SECRET:?set GMAIL_ENCRYPTION_SECRET in .env, see .env.example}
      FINANCE_ENCRYPTION_SECRET: ${FINANCE_ENCRYPTION_SECRET:?set FINANCE_ENCRYPTION_SECRET in .env, see .env.example}
      GMAIL_ALERT_SENDERS: ${GMAIL_ALERT_SENDERS:-canarabank@canarabank.com,alerts@hdfcbank.net,alerts@hdfcbank.bank.in}
      GMAIL_JOB_SEARCH_SENDERS: ${GMAIL_JOB_SEARCH_SENDERS:-jobalerts-noreply@linkedin.com,jobs-noreply@linkedin.com,jobs-noreply@naukri.com,info@naukri.com,noreply@greenhouse.io,no-reply@greenhouse.io,noreply@lever.co,notifications@smartrecruiters.com,noreply@myworkday.com,noreply@ashbyhq.com,no-reply@icims.com}
      GMAIL_JOB_SEARCH_KEYWORDS: ${GMAIL_JOB_SEARCH_KEYWORDS:-application,applied,interview,offer,not moving forward,not selected,moving forward,thank you for applying,thanks for applying,update on your application}
      GMAIL_POLL_CRON: ${GMAIL_POLL_CRON:-0 */15 * * * *}
    volumes:
      - job_tracker_resumes:/data/resumes
    ports:
      - "127.0.0.1:8005:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  ollama_data:
  postgres_data:
  job_tracker_resumes:
