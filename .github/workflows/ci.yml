name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifeos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Every module is a library jar assembled by services/app, so one reactor build tests them all.
      - name: Run backend tests
        run: cd services && mvn -B clean test
        env:
          # Lets the app module's boot test start every module against the Postgres service above.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lifeos
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i

      - name: Lint web app
        run: cd apps/web && pnpm run lint
        continue-on-error: false

      - name: Lint mobile app
        run: cd apps/mobile && pnpm run lint
        continue-on-error: false

      - name: Build web app
        run: cd apps/web && pnpm run build

      - name: Typecheck mobile app
        run: cd apps/mobile && npx tsc --noEmit
