name: E2E

# Brings up the whole stack on the runner (its own machine, so a developer's Docker is never touched) and runs
# the Playwright suite against the built web app. Run it by hand from the Actions tab, or it runs on pull
# requests into main as the release gate.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -p lifeos-e2e -f docker-compose.yml -f apps/web/e2e/docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies and build the web app
        run: |
          pnpm i
          pnpm --filter web build

      - name: Install the Playwright browser
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Write a throwaway .env
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "INTERNAL_API_KEY=$(openssl rand -base64 32)"
            echo "GMAIL_ENCRYPTION_SECRET=$(openssl rand -base64 32)"
            echo "FINANCE_ENCRYPTION_SECRET=$(openssl rand -base64 32)"
            echo "OWNER_USER_ID=00000000-0000-0000-0000-000000000001"
            echo "GMAIL_CLIENT_ID=unused"
            echo "GMAIL_CLIENT_SECRET=unused"
          } > .env

      - name: Start the stack
        run: $COMPOSE up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8088/v1/auth/login -H 'Content-Type: application/json' -d '{}' || true)
            [ "$code" = "400" ] && exit 0
            sleep 5
          done
          echo "The API never came up"; exit 1

      - name: Run the e2e suite
        run: cd apps/web && E2E_BASE_URL=http://localhost:8088 pnpm exec playwright test

      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=200 > compose.log || true

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
            compose.log
          if-no-files-found: ignore
