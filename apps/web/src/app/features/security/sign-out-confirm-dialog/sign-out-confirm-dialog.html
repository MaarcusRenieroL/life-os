<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [showHeader]="false"
  [style]="{ width: '25rem' }"
  styleClass="font-mono border border-danger-alt/35"
>
  <div class="pt-2">
    <div class="mb-2 text-[15px] font-semibold text-danger-alt">{{ title() }}</div>
    <p class="mb-5 text-[12.5px] leading-relaxed text-foreground/65">{{ description() }}</p>

    @if (!isAllSessions()) {
      <div class="mb-5 rounded-[0.45rem] border border-border bg-background p-3.5">
        <div class="text-xs text-foreground/75">{{ deviceName() }}</div>
      </div>
    }

    <div class="flex justify-end gap-2.5">
      <p-button label="Cancel" severity="secondary" (onClick)="cancel()" />
      <p-button [label]="confirmLabel()" severity="danger" (onClick)="confirm()" />
    </div>
  </div>
</p-dialog>
