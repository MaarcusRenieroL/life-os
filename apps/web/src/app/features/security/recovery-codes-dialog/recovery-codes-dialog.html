<p-dialog
  [(visible)]="visible"
  header="Recovery codes"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '28rem' }"
  styleClass="font-mono"
>
  <p class="mb-4 text-[11.5px] text-foreground/55">
    Each code can be used once to regain access if you lose your master password. Store them somewhere offline.
  </p>

  <div class="mb-4 grid grid-cols-2 gap-2.5 rounded-[0.45rem] border border-border bg-background p-4 text-[13px] tracking-[0.03em]">
    @for (item of codes(); track item.code) {
      <div [class]="item.used ? 'line-through text-foreground/30' : ''">{{ item.code }}</div>
    }
  </div>

  <div class="mb-4 flex justify-between text-[11.5px] text-foreground/55">
    <span>{{ remainingCount() }} of {{ codes().length }} codes remaining</span>
    <span>{{ generatedLabel() }}</span>
  </div>

  <div class="flex gap-2.5">
    <p-button label="Download .txt" severity="secondary" styleClass="flex-1" (onClick)="downloadCodes()" />
    <p-button label="Regenerate all" severity="secondary" styleClass="flex-1" (onClick)="regenerateAll()" />
  </div>

  <div class="mt-5 flex justify-end">
    <p-button label="Done" (onClick)="done()" />
  </div>
</p-dialog>
