<p-dialog
  [(visible)]="visible"
  header="Change master password"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '28rem' }"
  styleClass="font-mono"
  (onShow)="onShow()"
>
  <p class="mb-4 text-[11.5px] text-foreground/55">
    This re-encrypts your entire vault. All other sessions will be signed out.
  </p>

  <form class="flex flex-col gap-3.5" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="currentMasterPassword" class="mb-1.5 block text-[11px] text-foreground/55">
        CURRENT MASTER PASSWORD
      </label>
      <p-password
        inputId="currentMasterPassword"
        formControlName="currentPassword"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </div>

    <div>
      <label for="newMasterPassword" class="mb-1.5 block text-[11px] text-foreground/55">
        NEW MASTER PASSWORD
      </label>
      <p-password
        inputId="newMasterPassword"
        formControlName="newPassword"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      <app-password-strength-meter class="mt-2 block" [password]="newPasswordValue() ?? ''" />
    </div>

    <div>
      <label for="confirmMasterPassword" class="mb-1.5 block text-[11px] text-foreground/55">
        CONFIRM NEW PASSWORD
      </label>
      <p-password
        inputId="confirmMasterPassword"
        formControlName="confirmPassword"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      @if (passwordsMismatch) {
        <span class="mt-1.5 block text-xs text-destructive">Passwords don't match.</span>
      }
    </div>

    <div class="flex items-center gap-2">
      <p-checkbox inputId="recoveryKitSaved" formControlName="recoveryKitSaved" [binary]="true" />
      <label for="recoveryKitSaved" class="text-[12.5px] text-foreground/75">
        I've saved a new recovery kit
      </label>
    </div>

    @if (errorMessage()) {
      <p class="text-xs text-destructive">{{ errorMessage() }}</p>
    }

    <div class="mt-1.5 flex justify-end gap-2.5">
      <p-button type="button" label="Cancel" severity="secondary" (onClick)="cancel()" />
      <p-button
        type="submit"
        label="Update password"
        [disabled]="!canSubmit"
        [loading]="submitting()"
      />
    </div>
  </form>
</p-dialog>
