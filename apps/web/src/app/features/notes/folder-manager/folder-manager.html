<p-dialog
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [style]="{ width: '440px', maxHeight: '76vh' }"
  header="Manage folders"
>
  <div class="flex max-h-[50vh] flex-col gap-0.5 overflow-y-auto py-1">
    @for (item of flatFolders(); track item.folder.id) {
      <div
        class="group flex items-center gap-2 rounded-[0.4rem] px-2 py-2 text-[13px] transition-colors hover:bg-white/5"
        [style.paddingLeft.px]="8 + item.depth * 18"
      >
        <span class="cursor-grab text-foreground/30" style="font-size: 11px" aria-hidden="true">⠿</span>

        @if (renamingId() === item.folder.id) {
          <input
            [ngModel]="renameDraft()"
            (ngModelChange)="renameDraft.set($event)"
            pInputText
            class="!py-1 flex-1 text-[12.5px]"
            (keydown.enter)="confirmRename(item.folder)"
            (keydown.escape)="cancelRename()"
            (blur)="confirmRename(item.folder)"
          />
        } @else {
          <span class="flex-1 truncate">{{ item.folder.name }}</span>
          <span class="text-[11px] text-foreground/40">{{ item.folder.noteCount }}</span>
          <button
            type="button"
            class="hidden rounded p-1 text-primary hover:bg-primary/10 group-hover:block"
            title="Rename"
            (click)="startRename(item.folder, $event)"
          >
            <i class="pi pi-pencil" style="font-size: 11px"></i>
          </button>
          <button
            type="button"
            class="hidden rounded p-1 text-destructive hover:bg-destructive/10 group-hover:block"
            title="Delete"
            (click)="deleteFolder(item.folder, $event)"
          >
            <i class="pi pi-trash" style="font-size: 11px"></i>
          </button>
        }
      </div>
    }
    @if (flatFolders().length === 0) {
      <p class="px-2 py-3 text-[12px] text-foreground/40">No folders yet - add one below.</p>
    }

    <input
      [ngModel]="newFolderName()"
      (ngModelChange)="newFolderName.set($event)"
      pInputText
      placeholder="+ new folder name..."
      class="mt-2 w-full border-dashed text-[12.5px]"
      (keydown.enter)="createFolder()"
    />
  </div>

  <div class="mt-4 flex justify-end border-t border-border/60 pt-3.5">
    <p-button label="Done" (onClick)="done()" />
  </div>
</p-dialog>

<p-confirmDialog />
