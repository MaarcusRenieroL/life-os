<p-dialog
  [(visible)]="visible"
  header="Generate password"
  [modal]="true"
  [style]="{ width: '28rem' }"
  styleClass="font-mono"
>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center gap-2">
        <input
          pInputText
          readonly
          [value]="generated()"
          class="w-full font-mono"
        />
        <p-button icon="pi pi-copy" severity="secondary" (onClick)="copyGenerated()" />
      </div>
      @if (clipboardService.copiedField() === 'generator') {
        <span class="text-xs text-primary">Copied!</span>
      }
      <app-password-strength-meter [password]="generated()" />
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="flex justify-between text-xs text-muted-foreground">
        <span>Length</span>
        <span>{{ options().length }}</span>
      </span>
      <p-slider
        [min]="8"
        [max]="64"
        [ngModel]="options().length"
        (ngModelChange)="setLength($event)"
      />
    </div>

    <div class="flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <label for="includeUppercase" class="text-sm text-muted-foreground">Uppercase (A-Z)</label>
        <p-toggleswitch
          inputId="includeUppercase"
          [ngModel]="options().includeUppercase"
          (ngModelChange)="toggleOption('includeUppercase')"
        />
      </div>
      <div class="flex items-center justify-between">
        <label for="includeLowercase" class="text-sm text-muted-foreground">Lowercase (a-z)</label>
        <p-toggleswitch
          inputId="includeLowercase"
          [ngModel]="options().includeLowercase"
          (ngModelChange)="toggleOption('includeLowercase')"
        />
      </div>
      <div class="flex items-center justify-between">
        <label for="includeNumbers" class="text-sm text-muted-foreground">Numbers (0-9)</label>
        <p-toggleswitch
          inputId="includeNumbers"
          [ngModel]="options().includeNumbers"
          (ngModelChange)="toggleOption('includeNumbers')"
        />
      </div>
      <div class="flex items-center justify-between">
        <label for="includeSymbols" class="text-sm text-muted-foreground">Symbols (!&#64;#...)</label>
        <p-toggleswitch
          inputId="includeSymbols"
          [ngModel]="options().includeSymbols"
          (ngModelChange)="toggleOption('includeSymbols')"
        />
      </div>
      <div class="flex items-center justify-between">
        <label for="excludeAmbiguous" class="text-sm text-muted-foreground">Exclude ambiguous (O0lI1)</label>
        <p-toggleswitch
          inputId="excludeAmbiguous"
          [ngModel]="options().excludeAmbiguous"
          (ngModelChange)="options.set({ ...options(), excludeAmbiguous: $event })"
        />
      </div>
    </div>

    <div class="mt-2 flex gap-2">
      <p-button label="Regenerate" severity="secondary" styleClass="flex-1" (onClick)="regenerate()" />
      <p-button label="Use this password" styleClass="flex-1" (onClick)="useThisPassword()" />
    </div>
  </div>
</p-dialog>
