<p-dialog
  [(visible)]="visible"
  header="Link service / subscription"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '28rem' }"
  styleClass="font-mono"
  (onShow)="onShow()"
>
  <form class="flex flex-col gap-3.5" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="subServiceName" class="mb-1.5 block text-[11px] text-foreground/55">SERVICE NAME</label>
      <input pInputText id="subServiceName" formControlName="serviceName" placeholder="e.g. Netflix" class="w-full" />
    </div>

    <div>
      <label for="subCardUsed" class="mb-1.5 block text-[11px] text-foreground/55">CARD USED</label>
      <p-select
        inputId="subCardUsed"
        formControlName="cardId"
        [options]="cardOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      />
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label for="subBillingCycle" class="mb-1.5 block text-[11px] text-foreground/55">BILLING CYCLE</label>
        <p-select
          inputId="subBillingCycle"
          formControlName="billingCycle"
          [options]="billingCycleOptions"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
      </div>
      <div>
        <label for="subAmount" class="mb-1.5 block text-[11px] text-foreground/55">AMOUNT</label>
        <input
          pInputText
          type="number"
          step="0.01"
          id="subAmount"
          formControlName="amount"
          placeholder="15.49"
          class="w-full"
        />
      </div>
    </div>

    <div>
      <label for="subRenewalDate" class="mb-1.5 block text-[11px] text-foreground/55">NEXT RENEWAL DATE</label>
      <input pInputText type="date" id="subRenewalDate" formControlName="nextRenewalDate" class="w-full" />
    </div>

    <div>
      <label for="subLinkedEntry" class="mb-1.5 block text-[11px] text-foreground/55">
        LINKED VAULT ENTRY (optional)
      </label>
      <p-select
        inputId="subLinkedEntry"
        formControlName="linkedVaultEntryId"
        [options]="vaultOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      />
    </div>

    <label class="flex items-center gap-2 text-[12.5px] text-foreground/75">
      <p-checkbox formControlName="remindBeforeRenewal" [binary]="true" />
      Remind me 3 days before renewal
    </label>

    <div class="mt-2 flex justify-end gap-2.5">
      <p-button type="button" label="Cancel" severity="secondary" (onClick)="cancel()" />
      <p-button type="submit" label="Save" />
    </div>
  </form>
</p-dialog>
