<main class="w-full px-4 py-9 font-mono text-foreground sm:px-11 sm:py-9 xl:px-11">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight">Resume</h1>
    <p class="mt-1.5 text-[12.5px] text-foreground/55">Upload your master resume for scoring and tailoring.</p>
  </div>

  @if (errorMessage()) {
    <div class="mb-4 rounded-[0.45rem] border border-destructive/35 bg-destructive/10 px-4 py-3 text-[12.5px] text-destructive">
      {{ errorMessage() }}
    </div>
  }

  @if (loading()) {
    <p class="text-[12.5px] text-foreground/50">Loading…</p>
  } @else {
    <div class="max-w-xl rounded-[0.5rem] border border-border bg-card p-6">
      @if (activeResume(); as resume) {
        <div class="mb-4 flex items-center justify-between">
          <div>
            <div class="text-[13px] font-semibold">Active resume</div>
            <div class="mt-0.5 text-[11px] text-foreground/45">Uploaded {{ resume.uploadedAt | date: 'medium' }}</div>
          </div>
          <span class="rounded-2xl bg-primary/15 px-2 py-0.5 text-[10px] text-primary">active</span>
        </div>
      } @else {
        <p class="mb-4 text-[12.5px] text-foreground/45">No resume uploaded yet.</p>
      }

      <label
        class="flex cursor-pointer flex-col items-center justify-center rounded-[0.4rem] border border-dashed border-border p-8 text-center"
      >
        <span class="text-[12px] font-semibold">{{ uploading() ? 'Uploading…' : 'Click to upload a PDF resume' }}</span>
        <input type="file" accept="application/pdf" class="hidden" (change)="onFileSelected($event)" [disabled]="uploading()" />
      </label>
    </div>
  }
</main>
