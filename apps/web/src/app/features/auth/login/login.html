<main class="flex min-h-dvh items-center justify-center px-4 font-mono text-foreground">
  <div class="surface-panel w-full max-w-sm p-8">
    <div class="mb-8">
      <p class="text-xs uppercase tracking-widest text-muted-foreground">life-os</p>
      <h1 class="mt-1 text-2xl font-semibold text-foreground">Sign in</h1>
      <p class="mt-2 text-sm text-muted-foreground">Access your vault and workspace.</p>
    </div>

    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs text-muted-foreground">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full"
          placeholder="you@example.com"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="text-xs text-destructive">A valid email is required.</span>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-xs text-muted-foreground">Password</label>
        <p-password
          inputId="password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="false"
          autocomplete="current-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="text-xs text-destructive">Password is required.</span>
        }
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-destructive">{{ errorMessage() }}</p>
      }

      <p-button
        type="submit"
        label="Sign in"
        styleClass="w-full mt-2"
        [loading]="loading()"
      />
    </form>
  </div>
</main>
