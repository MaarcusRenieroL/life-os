<p-dialog
  [(visible)]="visible"
  header="Reconcile account"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '22rem' }"
  styleClass="font-mono"
  (onShow)="onShow()"
>
  <form class="flex flex-col gap-3.5" [formGroup]="form" (ngSubmit)="submit()">
    @if (account(); as a) {
      <p class="text-[11.5px] text-foreground/55">
        {{ accountLabel(a) }} ({{ accountSubLabel(a) }}) — app balance {{ a.currentBalance | number: '1.0-0' }}
      </p>
    }

    <div>
      <label for="stmtBalance" class="mb-1.5 block text-[11px] text-foreground/55">STATEMENT BALANCE</label>
      <p-inputnumber
        inputId="stmtBalance"
        formControlName="statementBalance"
        mode="currency"
        currency="INR"
        locale="en-IN"
        [minFractionDigits]="0"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </div>

    <div>
      <label for="stmtDate" class="mb-1.5 block text-[11px] text-foreground/55">STATEMENT DATE</label>
      <p-datepicker inputId="stmtDate" formControlName="statementDate" dateFormat="M d, yy" styleClass="w-full" appendTo="body" />
    </div>

    <div class="mt-2 flex justify-end gap-2.5">
      <p-button type="button" label="Cancel" severity="secondary" (onClick)="cancel()" />
      <p-button type="submit" label="Reconcile" />
    </div>
  </form>
</p-dialog>
