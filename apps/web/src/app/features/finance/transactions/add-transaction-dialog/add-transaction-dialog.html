<p-dialog
  [(visible)]="visible"
  [header]="editing() ? 'Edit transaction' : 'Add transaction'"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '28rem' }"
  styleClass="font-mono"
  (onShow)="onShow()"
>
  <form class="flex flex-col gap-3.5" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="txnAccount" class="mb-1.5 block text-[11px] text-foreground/55">ACCOUNT</label>
      <p-select
        inputId="txnAccount"
        formControlName="accountId"
        [options]="accounts()"
        optionLabel="accountName"
        optionValue="id"
        placeholder="Select an account"
        styleClass="w-full"
        appendTo="body"
      />
    </div>

    <div>
      <label for="txnDescription" class="mb-1.5 block text-[11px] text-foreground/55">DESCRIPTION</label>
      <input
        pInputText
        id="txnDescription"
        formControlName="description"
        placeholder="e.g. Swiggy"
        class="w-full"
      />
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label for="txnAmount" class="mb-1.5 block text-[11px] text-foreground/55">AMOUNT</label>
        <p-inputnumber
          inputId="txnAmount"
          formControlName="amount"
          mode="currency"
          currency="INR"
          locale="en-IN"
          [minFractionDigits]="0"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>
      <div>
        <label for="txnType" class="mb-1.5 block text-[11px] text-foreground/55">TYPE</label>
        <p-select
          inputId="txnType"
          formControlName="type"
          [options]="typeOptions"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
          appendTo="body"
        />
      </div>
    </div>

    <div>
      <label for="txnDate" class="mb-1.5 block text-[11px] text-foreground/55">DATE</label>
      <p-datepicker inputId="txnDate" formControlName="transactionDate" dateFormat="M d, yy" styleClass="w-full" appendTo="body" />
    </div>

    <div>
      <label for="txnNotes" class="mb-1.5 block text-[11px] text-foreground/55">NOTES (OPTIONAL)</label>
      <input pInputText id="txnNotes" formControlName="notes" class="w-full" />
    </div>

    <div class="mt-2 flex justify-end gap-2.5">
      <p-button type="button" label="Cancel" severity="secondary" (onClick)="cancel()" />
      <p-button type="submit" [label]="editing() ? 'Save changes' : 'Add transaction'" />
    </div>
  </form>
</p-dialog>
