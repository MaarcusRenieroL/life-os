<p-dialog
  [(visible)]="visible"
  [header]="editing() ? 'Edit category' : 'New category'"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '22rem' }"
  styleClass="font-mono"
  (onShow)="onShow()"
>
  <form class="flex flex-col gap-3.5" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="catName" class="mb-1.5 block text-[11px] text-foreground/55">NAME</label>
      <input pInputText id="catName" formControlName="name" placeholder="e.g. Dining" class="w-full" />
    </div>

    <div>
      <label for="catType" class="mb-1.5 block text-[11px] text-foreground/55">TYPE</label>
      <p-select
        inputId="catType"
        formControlName="type"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        appendTo="body"
      />
    </div>

    <div class="flex items-start gap-2">
      <input type="checkbox" id="catExcludeLearning" formControlName="excludeFromAutoLearning" class="mt-0.5" />
      <label for="catExcludeLearning" class="text-[11.5px] text-foreground/60">
        Don't auto-create rules from this category (for one-off payments to people, like drivers)
      </label>
    </div>

    <div class="mt-2 flex justify-end gap-2.5">
      <p-button type="button" label="Cancel" severity="secondary" (onClick)="cancel()" />
      <p-button type="submit" [label]="editing() ? 'Save changes' : 'Create category'" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
