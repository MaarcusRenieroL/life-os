<div class="flex flex-col gap-1">
  <div class="flex gap-1">
    @for (segment of segments; track segment) {
      <div
        class="h-1 flex-1 rounded"
        [class]="segment < strength().score ? colorForScore(strength().score) : 'bg-muted'"
      ></div>
    }
  </div>

  @if (password().length > 0) {
    <span class="text-xs" [class]="textColorForScore(strength().score)">
      {{ strength().label }}
    </span>
  }
</div>
